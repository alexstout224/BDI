name: Refresh Schedule

on:
  workflow_dispatch: {}
  schedule:
    # Every Tuesday at 11:00 UTC (6am CT during the season) — same cadence
    # as Refresh Player Positions. The current week's schedule is usually
    # locked in well before then, but flex scheduling can move Sun/Mon/Thu
    # games later in the season, so this re-checks the current week each run.
    - cron: '0 11 * * 2'

permissions:
  contents: write

jobs:
  refresh-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run refresh-schedule.js
        run: node scripts/refresh-schedule.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git diff --staged --quiet || git commit -m "Refresh schedule data"
          git push
