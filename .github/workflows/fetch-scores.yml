name: Fetch Scores

on:
  schedule:
    # Sunday games (1pm ET = 17:00 UTC through midnight)
    - cron: '*/10 17-23 * * 0'
    # Sunday late / SNF overflow (midnight-4am ET Monday = 04:00 UTC)
    - cron: '*/10 0-4 * * 1'
    # Monday Night Football (8pm ET = 00:00 UTC Tuesday)
    - cron: '*/10 0-4 * * 2'
    # Thursday Night Football (8pm ET = 00:00 UTC Friday)
    - cron: '*/10 0-4 * * 5'
    # Wednesday opener Week 1 (Sep 9 2026, 8pm ET = 00:00 UTC Thu)
    - cron: '*/10 0-4 * * 4'
    # Saturday late-season games
    - cron: '*/10 17-23 * * 6'
    - cron: '*/10 0-4 * * 0'
    # Daily morning sync (6am ET = 10:00 UTC)
    - cron: '0 10 * * *'

  # Manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch scores from Sleeper
        run: node scripts/fetch-scores.js

      - name: Commit if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scores.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update scores $(date -u +'%b %d %H:%M UTC')"
            git push
          fi
