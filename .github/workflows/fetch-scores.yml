name: Fetch Scores

on:
  workflow_dispatch:

concurrency:
  group: fetch-scores
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch scores from Sleeper
        run: node scripts/fetch-scores.js

      - name: Commit if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scores.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update scores $(date -u +'%b %d %H:%M UTC')"
            git push
          fi
